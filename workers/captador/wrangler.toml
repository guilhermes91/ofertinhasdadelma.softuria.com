# Worker "captador" — APENAS o RELÓGIO da captação. Não faz scraping nem monetização:
# só chama as Functions do Pages (/api/bot e /api/shopee), que já têm toda a lógica
# (captura + geração inline do link de afiliado). O ganho aqui é CADÊNCIA CONFIÁVEL:
# Cron Triggers de Worker rodam DENTRO da Cloudflare, sem o throttle do GitHub Actions
# (que degradava o */10 pra ~1x/hora). Ver CONTEXTO.md §6.10.
name = "ofertinhas-captador"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Crons DESATIVADOS (2026-07-05, §6.16): o único relógio agora é o cron LOCAL horário
# (tarefa Windows "OfertinhasRelinkLocal" → relink-kv.mjs --cycle), que captura (cutuca
# /api/bot, /api/shopee, /api/mirror) + relinka em sequência. Lista vazia = Worker não
# dispara sozinho (segue deployado, sem cron). Reativar = repor os crons abaixo.
# ["*/10 * * * *" (ML), "7,37 * * * *" (Shopee), "4,24 * * * *" (mirror)]
[triggers]
crons = []

[vars]
SITE = "https://ofertinhasdadelma.softuria.com"

# BOT_TOKEN é SECRET (wrangler secret put, via deploy-worker.yml) — NÃO vai aqui (repo público).
# Menor privilégio: o Worker só tem o token de captação, sem bind do OFFERS_KV (que daria
# acesso a ml:session/aff:token). Ele autentica no /api/bot com Bearer, igual ao bot.yml faz.
