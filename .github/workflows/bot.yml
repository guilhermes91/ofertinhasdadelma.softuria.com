name: Bot de ofertas (Mercado Livre)

# Único agendamento do projeto: a busca nas fontes (cron 10min). Quando captura algo,
# o link de afiliado é gerado NO MESMO run (job `relink` reusable) — sem segundo dispatch.
on:
  workflow_dispatch:
    inputs:
      max:
        description: "Máximo de ofertas a capturar nesta execução"
        required: false
        default: "8"
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (ARMADO)

# Serializa os runs do bot: o KV é uma chave única (offers:all) com read-modify-write
# sem lock — dois runs sobrepostos se sobrescreveriam (last-write-wins). cancel-in-progress
# false = enfileira em vez de cancelar (não perde captura).
concurrency:
  group: bot-offers
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    outputs:
      should_relink: ${{ steps.captura.outputs.should_relink }}
    steps:
      - name: Disparar captação no /api/bot
        id: captura
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MAX: ${{ github.event.inputs.max || '8' }}
        run: |
          set -euo pipefail
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::Secret BOT_TOKEN não configurado no repositório."
            exit 1
          fi
          echo "Disparando captação (max=$MAX)..."
          # UA de browser: o Bot Fight Mode do Cloudflare bloqueia (403) UAs tipo "curl/"
          # ANTES de chegar na Function. Sem isto o cron roda "verde" mas não capta nada.
          code=$(curl -sS -w '%{http_code}' -o resposta.json -X POST \
            "https://ofertinhasdadelma.softuria.com/api/bot?max=$MAX" \
            -H "Authorization: Bearer $BOT_TOKEN" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")
          echo "HTTP $code"
          cat resposta.json 2>/dev/null || true
          echo ""
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Bot retornou HTTP $code (esperava 2xx). Veja o corpo acima."
            exit 1
          fi
          # Entrou oferta nova OU corrigiu preço/cupom (que pode ter ficado sem link) ->
          # gera o nosso link na sequência. `refreshed` (repost já-linkado) NÃO conta.
          if [ "$(jq '((.added//0)+(.corrected//0))' resposta.json)" -gt 0 ]; then
            echo "should_relink=1" >> "$GITHUB_OUTPUT"
          fi
          echo "Concluído."

  # MESMA run: gera o nosso link de afiliado logo após a captura (a API é sempre on).
  # Só roda se a captura mudou algo. Reusa o relink.yml (1 fonte de verdade; o manual
  # seed/compliance continua por workflow_dispatch). Falha de API fora cai VERDE (warning)
  # dentro do relink.yml -> não vira spam vermelho; a oferta relinka na próxima busca.
  relink:
    needs: capturar
    if: needs.capturar.outputs.should_relink == '1'
    uses: ./.github/workflows/relink.yml
    secrets: inherit
