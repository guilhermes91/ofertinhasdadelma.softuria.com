name: Bot de ofertas (Mercado Livre)

# DESARMADO por padrão: roda só no disparo manual (workflow_dispatch).
# Para ARMAR o cron de 10 em 10 min, descomente o bloco `schedule` abaixo.
on:
  workflow_dispatch:
    inputs:
      max:
        description: "Máximo de ofertas a capturar nesta execução"
        required: false
        default: "8"
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (ARMADO)

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar captação no /api/bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MAX: ${{ github.event.inputs.max || '8' }}
        run: |
          set -euo pipefail
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::Secret BOT_TOKEN não configurado no repositório."
            exit 1
          fi
          echo "Disparando captação (max=$MAX)..."
          # UA de browser: o Bot Fight Mode do Cloudflare bloqueia (403) UAs tipo "curl/"
          # ANTES de chegar na Function. Sem isto o cron roda "verde" mas não capta nada.
          code=$(curl -sS -w '%{http_code}' -o resposta.json -X POST \
            "https://ofertinhasdadelma.softuria.com/api/bot?max=$MAX" \
            -H "Authorization: Bearer $BOT_TOKEN" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")
          echo "HTTP $code"
          cat resposta.json 2>/dev/null || true
          echo ""
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Bot retornou HTTP $code (esperava 2xx). Veja o corpo acima."
            exit 1
          fi
          echo "Concluído."
