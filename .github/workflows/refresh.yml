name: Refresh catalogo (campos derivados)

# Re-deriva store/model, zera bestseller stale e normaliza coupon nas ofertas ja
# gravadas (one-shot/manual). Nao re-scrapeia. Protegido por BOT_TOKEN.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = so simula (nao grava)"
        required: false
        default: "0"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar /api/refresh
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DRY: ${{ github.event.inputs.dry || '0' }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ]; then echo "::error::BOT_TOKEN ausente."; exit 1; fi
          Q=""; [ "$DRY" = "1" ] && Q="?dry=1"
          code=$(curl -sS -w '%{http_code}' -o resp.json -X POST \
            "https://ofertinhasdadelma.softuria.com/api/refresh$Q" \
            -H "Authorization: Bearer $BOT_TOKEN" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")
          echo "HTTP $code"; cat resp.json; echo ""
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "::error::refresh HTTP $code"; exit 1; fi
