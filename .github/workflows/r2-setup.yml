name: R2 setup (criar bucket de imagens)

# Cria o bucket R2 `ofertinhas-img` (depósito das imagens hospedadas por nós) usando o
# CLOUDFLARE_API_TOKEN que já existe. Diagnóstico: lista os buckets antes (mostra se o R2
# está ativo e se o token tem permissão de R2). Manual (workflow_dispatch).
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Diagnóstico — listar buckets R2 (mostra se R2 está ativo + token tem permissão)
        run: |
          echo "== wrangler r2 bucket list =="
          npx --yes wrangler@3 r2 bucket list || echo "::warning::list falhou (R2 talvez inativo OU token sem permissão R2)"
      - name: Criar bucket ofertinhas-img (idempotente — se já existe, segue)
        run: |
          echo "== criando bucket =="
          npx --yes wrangler@3 r2 bucket create ofertinhas-img || echo "::warning::create falhou (ver mensagem acima)"
          echo "== lista final =="
          npx --yes wrangler@3 r2 bucket list || true

      - name: Inspecionar bindings do Pages (READ-ONLY, redige valores)
        run: |
          echo "== estrutura atual de bindings/vars do projeto Pages (só as CHAVES) =="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/ofertinhasdadelma" \
            | jq '{success, errors, prodKeys: (.result.deployment_configs.production | keys), kv: (.result.deployment_configs.production.kv_namespaces // {} | keys), r2: (.result.deployment_configs.production.r2_buckets // {} | keys), vars: (.result.deployment_configs.production.env_vars // {} | keys)}'

      - name: Plugar R2 (PATCH ADITIVO) + verificar que KV/secrets sobreviveram
        run: |
          echo "== PATCH: adiciona binding IMG_BUCKET -> ofertinhas-img (merge, não toca o resto) =="
          curl -s -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/ofertinhasdadelma" \
            --data '{"deployment_configs":{"production":{"r2_buckets":{"IMG_BUCKET":{"name":"ofertinhas-img"}}}}}' \
            | jq '{success, errors}'
          echo "== VERIFICAÇÃO pós-PATCH (KV + vars TÊM que continuar lá) =="
          OUT=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/ofertinhasdadelma")
          echo "$OUT" | jq '{kv: (.result.deployment_configs.production.kv_namespaces // {} | keys), r2: (.result.deployment_configs.production.r2_buckets // {} | keys), vars: (.result.deployment_configs.production.env_vars // {} | keys)}'
          KV=$(echo "$OUT" | jq -r '.result.deployment_configs.production.kv_namespaces.OFFERS_KV.namespace_id // empty')
          R2=$(echo "$OUT" | jq -r '.result.deployment_configs.production.r2_buckets.IMG_BUCKET.name // empty')
          NV=$(echo "$OUT" | jq -r '.result.deployment_configs.production.env_vars | length')
          echo "KV OFFERS_KV id presente? ${KV:+SIM} | R2 IMG_BUCKET=$R2 | nº de env_vars=$NV"
          if [ -z "$KV" ] || [ "$R2" != "ofertinhas-img" ] || [ "$NV" -lt 4 ]; then
            echo "::error::PATCH pode ter danificado a config (KV/vars/R2). REVISAR ANTES DE DEPLOYAR."; exit 1
          fi
          echo "OK — R2 plugado, KV e secrets intactos."
