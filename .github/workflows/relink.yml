name: Relink afiliado (via API gerador-aff-links)

# Gera os NOSSOS links de afiliado pela API externa (gerador-aff-links) e grava de volta.
# A API nova é um HOSTNAME HTTPS (sem EC2 sob demanda) — base no secret AFFILIATE_API_BASE,
# token no secret AFFILIATE_API_TOKEN. Manda o sourceUrl (meli.la) de cada oferta; a API
# resolve o produto e devolve o short_url com a nossa tag.
# Fluxo: [seed opcional] -> /health -> list -> POST /afiliado {urls} -> apply.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Backfill sourceUrl: JSON [{"mlId":"...","sourceUrl":"https://meli.la/..."}]'
        required: false
        default: ""
  # Chamado pelo bot.yml LOGO APÓS a busca (mesmo run, sem segundo dispatch). Único
  # agendamento do projeto = a busca (bot, 10min). Mantém o dispatch manual (seed/compliance).
  workflow_call:
    inputs:
      seed:
        required: false
        type: string
        default: ""

jobs:
  relink:
    runs-on: ubuntu-latest
    concurrency:
      group: relink
      cancel-in-progress: false
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      API: ${{ secrets.AFFILIATE_API_BASE }}
      AFF_TOKEN: ${{ secrets.AFFILIATE_API_TOKEN }}
      SEED: ${{ inputs.seed || github.event.inputs.seed }}
      SITE: https://ofertinhasdadelma.softuria.com
      BUA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
    steps:
      - name: Gerar e aplicar links
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ]; then echo "::error::BOT_TOKEN ausente."; exit 1; fi
          if [ -z "${API:-}" ]; then echo "::error::secret AFFILIATE_API_BASE ausente."; exit 1; fi
          if [ -z "${AFF_TOKEN:-}" ]; then echo "::error::secret AFFILIATE_API_TOKEN ausente."; exit 1; fi

          echo "== 0) garante a config da API no KV (pro /captar gerar link em tempo real) =="
          curl -fsS -A "$BUA" -H "Authorization: Bearer $BOT_TOKEN" -H "Content-Type: application/json" \
            -X POST "$SITE/api/relink" -d "{\"aff\":{\"url\":\"$API\",\"token\":\"$AFF_TOKEN\"}}" >/dev/null \
            && echo "config no KV ok" || echo "::warning::não consegui setar a config no KV"

          if [ -n "${SEED:-}" ]; then
            echo "== 0) seed de sourceUrl =="
            echo "{\"seed\": $SEED}" > seed.json
            curl -fsS -A "$BUA" -H "Authorization: Bearer $BOT_TOKEN" -H "Content-Type: application/json" \
              -X POST "$SITE/api/relink" -d @seed.json; echo ""
          fi

          echo "== 1) /health da API =="
          # Falha de /health = API fora AGORA, não é bug nosso. Sai VERDE com aviso — as
          # ofertas ficam escondidas (filtro hasOurLink) e relinkam na próxima busca.
          # (Bug real — apply 5xx etc. — ainda falha vermelho mais abaixo.)
          if ! health=$(curl -fsS --max-time 25 "$API/health"); then
            echo "::warning::API de afiliado fora ($API) — ofertas novas ficam escondidas até relinkar."
            exit 0
          fi
          echo "$health"
          if ! echo "$health" | jq -e '.ml_session == true' >/dev/null; then
            echo "::warning::Sessão ML caída na API (ml_session != true) — links ML podem falhar até re-login."
          fi

          echo "== 2) candidatos =="
          curl -fsS -A "$BUA" -H "Authorization: Bearer $BOT_TOKEN" "$SITE/api/relink?list=1" -o cand.json
          N=$(jq '.candidates | length' cand.json)
          echo "candidatos: $N"
          if [ "$N" -eq 0 ]; then echo "Nada a relinkar. Fim."; exit 0; fi

          jq -c '.candidates' cand.json > cands.json

          echo "== 3a) resolve cada link ao destino final (/social) — forma que a API aceita =="
          # meli.la / mercadolivre.com/sec / bit.ly / dpl.pelando resolvem todos p/ /social?ref=;
          # a API rejeita /sec, /p/<itemId> e produto/MLB-, mas aceita o /social resolvido.
          jq -r '.candidates[].genUrl' cand.json > urls.txt
          : > resolved.txt
          while IFS= read -r u; do
            f=$(curl -sS -A "$BUA" -L --max-time 30 -o /dev/null -w '%{url_effective}' "$u" 2>/dev/null || true)
            echo "${f:-$u}" >> resolved.txt
          done < urls.txt
          jq -R -s 'split("\n") | map(select(. != ""))' resolved.txt > resolved.json
          RN=$(jq 'length' resolved.json)
          echo "resolvidas: $RN de $N"

          echo "== 3b) gerar via POST /afiliado em lotes de 20 (limite da API) =="
          echo '[]' > allres.json
          off=0
          while [ "$off" -lt "$RN" ]; do
            END=$((off + 20))
            jq -c ".[$off:$END] | {urls: .}" resolved.json > batch_req.json
            if curl -fsS --max-time 240 -X POST "$API/afiliado" \
                 -H "Authorization: Bearer $AFF_TOKEN" -H "Content-Type: application/json" \
                 -d @batch_req.json -o gen.json; then
              jq -s '.[0] + (.[1].resultados // [])' allres.json gen.json > allres2.json && mv allres2.json allres.json
            else
              echo "::warning::lote $off falhou; segue."
            fi
            off=$END
          done
          # resultados alinhados por índice ao candidato; só usa item ok==true
          jq -n --slurpfile c cands.json --slurpfile r allres.json '
            { updates: [ range(0; ($c[0] | length)) as $i
                | { id: $c[0][$i].id,
                    link: (($r[0][$i] // {}) | select(.ok == true) | (.short_url // .affiliate_url // .long_url)) }
                | select(.link != null) ] }' > updates.json
          U=$(jq '.updates | length' updates.json)
          echo "links gerados: $U de $N"
          echo "== falhas (item ok=false) =="
          jq -r '.[]? | select(.ok != true) | "\(.url // "?")  ERR=\(.erro // "?")"' allres.json | head -20 || true

          echo "== 4) aplicar no site =="
          code=$(curl -sS -w '%{http_code}' -o applied.json -X POST "$SITE/api/relink" \
            -A "$BUA" -H "Authorization: Bearer $BOT_TOKEN" -H "Content-Type: application/json" -d @updates.json)
          echo "apply HTTP $code"; cat applied.json; echo ""
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "::error::apply HTTP $code"; exit 1; fi
